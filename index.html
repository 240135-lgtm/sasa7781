<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монитор статусов + Чат</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-panel: #1e1e1e;
            --bg-hover: #2a2a2a;
            --text-light: #ffffff;
            --text-dim: #a0a0a0;
            --border: #333333;
            --primary-blue: #3b82f6;
            --danger-red: #e63946;
            --success-green: #2a9d8f;
            --warning-yellow: #ffb703;
            --secondary-grey: #6c757d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .app-layout {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            height: 90vh;
        }

        /* БОКОВАЯ ПАНЕЛЬ */
        .sidebar {
            width: 320px;
            background: var(--bg-panel);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        .widget-header { text-align: center; font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; }
        .widget-timer { text-align: center; font-size: 2.2rem; color: var(--primary-blue); font-weight: bold; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 10px; }

        .btn-full { width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 1.1rem; border: none; cursor: pointer; margin-bottom: 12px; display: flex; justify-content: center; align-items: center; gap: 8px; color: white; transition: 0.2s; }
        .btn-row { display: flex; gap: 12px; }
        .btn-half { flex: 1; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 1rem; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; color: white; transition: 0.2s; }

        .btn-red { background: var(--danger-red); } .btn-red:hover { background: #c1121f; }
        .btn-green { background: var(--success-green); } .btn-green:hover { background: #21867a; }
        .btn-yellow { background: var(--warning-yellow); color: #1e1e1e; } .btn-yellow:hover { background: #fb8500; }
        .btn-grey { background: var(--secondary-grey); } .btn-grey:hover { background: #495057; }
        .btn-google { width: 100%; padding: 12px; background: white; color: #333; border: none; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; margin-top: 20px;}

        /* РЕЙТИНГ (ТОП СТУДЕНТОВ) */
        .top-users-section { margin-top: 30px; }
        .top-user-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        .top-user-item:last-child { border-bottom: none; }
        .top-medal { font-size: 1.2rem; margin-right: 8px; }

        /* ОСНОВНОЙ КОНТЕНТ */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: var(--bg-panel);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .panel h2 { font-size: 1.2rem; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; }

        /* СПИСОК ГРУППЫ */
        .group-list { flex: 1; overflow-y: auto; max-height: 300px; }
        .user-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .user-item:last-child { border-bottom: none; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 15px; flex-shrink: 0; box-shadow: 0 0 8px rgba(255,255,255,0.1); }
        .username { font-weight: 600; flex-grow: 1; display: flex; align-items: center; gap: 8px; }
        .achievements-badges { font-size: 1.1rem; letter-spacing: 2px; }
        .status-tag { font-size: 0.75rem; color: var(--text-dim); background: var(--bg-hover); padding: 6px 12px; border-radius: 10px; border: 1px solid #444; white-space: nowrap; margin-left: 10px; }
        .timer-badge { font-family: monospace; background: var(--bg-hover); color: #e0e0e0; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; margin-right: 10px; font-weight: 600; border: 1px solid #444; }

        .online-pulse { display: inline-block; width: 8px; height: 8px; background-color: var(--success-green); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(42, 157, 143, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(42, 157, 143, 0); }
            100% { box-shadow: 0 0 0 0 rgba(42, 157, 143, 0); }
        }

        /* ЧАТ */
        .chat-box { flex: 1; background: var(--bg-main); border: 1px solid var(--border); border-radius: 12px; padding: 15px; overflow-y: auto; margin-bottom: 12px; min-height: 200px; }
        .chat-message { margin-bottom: 8px; line-height: 1.4; word-break: break-word; }
        .chat-name { font-weight: bold; color: var(--primary-blue); margin-right: 5px; }
        
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-main); color: white; outline: none; font-size: 1rem; }
        .chat-input:focus { border-color: var(--primary-blue); }
        .chat-send { width: 52px; border: none; border-radius: 10px; background: var(--success-green); color: white; font-size: 1.2rem; cursor: pointer; }
        .chat-send:hover { background: #21867a; }

        @media (max-width: 768px) {
            .app-layout { flex-direction: column; height: auto; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar">
            <h2 style="font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px;">👤 Мой профиль</h2>
            <div id="authSection">
                <div style="text-align: center; color: var(--text-dim);">Загрузка...</div>
            </div>

            <div class="top-users-section">
                <h2 style="font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; color: var(--warning-yellow);">🏆 Топ по времени</h2>
                <div id="leaderboardList">
                    <div style="text-align: center; color: var(--text-dim); font-size: 0.9rem;">Загрузка рейтинга...</div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="panel" style="flex: 1;">
                <h2>👥 Монитор группы (Значки: 🌅Пташка, 🏃‍♂️Марафон, 💬Активист)</h2>
                <div id="groupList" class="group-list">
                    <div style="text-align: center; color: var(--text-dim);">Загрузка списка...</div>
                </div>
            </div>

            <div class="panel" style="flex: 1;">
                <h2>💬 Общий чат</h2>
                <div id="chatBox" class="chat-box">
                    <div style="color: var(--text-dim);">Загрузка сообщений...</div>
                </div>
                <div class="chat-input-row">
                    <input id="chatInput" class="chat-input" placeholder="Введите сообщение..." />
                    <button id="sendMessageBtn" class="chat-send">➤</button>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const URL = 'https://ysqixhzrevitbcqmhhuz.supabase.co';
        const KEY = 'sb_publishable_1QFd7P35_JdzaMJLps-n7w_TPWQ0sDI';
        const supabase = createClient(URL, KEY);

        let currentUser = null;
        let myProfileData = null; // Данные текущего пользователя из БД
        let myStartTime = null;

        // Карта значков
        const BADGES = {
            'early_bird': '🌅',
            'marathoner': '🏃‍♂️',
            'activist': '💬',
            'first_step': '🌱'
        };

        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            const authSection = document.getElementById('authSection');

            if (user) {
                currentUser = user;

                // Создаем или обновляем базовый профиль при входе
                await supabase.from('profiles').upsert({
                    id: user.id,
                    username: user.user_metadata.full_name || user.email
                }, { onConflict: 'id', ignoreDuplicates: true });

                renderProfileWidget(user);
                fetchGroup();
            } else {
                authSection.innerHTML = `
                    <div style="text-align: center; margin-bottom: 15px; color: var(--text-dim);">Войдите, чтобы отметиться и писать в чат</div>
                    <button class="btn-google" id="loginBtn">
                        <img src="https://www.google.com/favicon.ico" width="16"> Войти через Google
                    </button>
                `;

                document.getElementById('loginBtn').onclick = () => {
                    supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: { redirectTo: window.location.href }
                    });
                };

                fetchGroup();
            }
            loadMessages();
        }

        function renderProfileWidget(user) {
            const authSection = document.getElementById('authSection');

            authSection.innerHTML = `
                <div class="widget-header">${user.user_metadata.full_name || user.email}</div>

                <div class="widget-timer">
                    ⏱️ <span id="mainTimerText">0 сек.</span>
                </div>

                <button class="btn-full btn-green" id="btnStart" style="display:none;" onclick="setStatus('🟢 Онлайн', '#2a9d8f', true)">
                    ▶️ Начать сессию
                </button>

                <button class="btn-full btn-red" id="btnEnd" style="display:none;" onclick="setStatus('🔴 Офлайн', '#e63946', false)">
                    ⛔ Завершить сессию
                </button>

                <div class="btn-row">
                    <button class="btn-half btn-yellow" onclick="setStatus('☕ Перерыв', '#ffb703', false)">
                        ☕ Перерыв
                    </button>

                    <button class="btn-half btn-grey" id="btnLogout">
                        Выход
                    </button>
                </div>
            `;

            document.getElementById('btnLogout').onclick = async () => {
                await supabase.auth.signOut();
                location.reload();
            };
        }

        // Обновление профиля текущего пользователя
        async function updateMyProfile(updates) {
            if (!currentUser) return;
            const { error } = await supabase.from('profiles').update(updates).eq('id', currentUser.id);
            if (error) console.error("Ошибка обновления профиля:", error);
        }

        window.setStatus = async (text, color, startTimer) => {
            if (!currentUser || !myProfileData) return;

            let updates = { status: text, color: color };
            let currentAchievs = myProfileData.achievements || [];

            if (startTimer) {
                updates.study_start_time = new Date().toISOString();
                updates.session_count = (myProfileData.session_count || 0) + 1;

                // ДОСТИЖЕНИЕ: Ранняя пташка (зашел до 8:00 утра)
                const currentHour = new Date().getHours();
                if (currentHour < 8 && !currentAchievs.includes('early_bird')) {
                    currentAchievs.push('early_bird');
                    updates.achievements = currentAchievs;
                    alert("Поздравляем! Вы получили значок 'Ранняя пташка' 🌅");
                }
            } else {
                updates.study_start_time = null;

                // Считаем время, если сессия была активна
                if (myProfileData.study_start_time) {
                    const diffMs = new Date().getTime() - new Date(myProfileData.study_start_time).getTime();
                    const diffSecs = Math.floor(diffMs / 1000);
                    updates.total_study_time = (myProfileData.total_study_time || 0) + diffSecs;

                    // ДОСТИЖЕНИЕ: Марафонец (проучился больше 2 часов = 7 200 000 мс за раз)
                    if (diffMs > 7200000 && !currentAchievs.includes('marathoner')) {
                        currentAchievs.push('marathoner');
                        updates.achievements = currentAchievs;
                        alert("Поздравляем! Вы получили значок 'Марафонец' 🏃‍♂️");
                    }
                }
            }

            await updateMyProfile(updates);
            fetchGroup();
        };

        function formatTime(diffMs, isTotal = false) {
            if (diffMs < 0) return isTotal ? '0м' : '0 сек.';
            let totalSeconds = Math.floor(diffMs / 1000);
            let hours = Math.floor(totalSeconds / 3600);
            totalSeconds %= 3600;
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;

            if (isTotal) {
                if (hours > 0) return `${hours}ч ${minutes}м`;
                return `${minutes}м`;
            }

            if (hours === 0 && minutes === 0) return `${seconds} сек.`;
            let text = '';
            if (hours > 0) text += `${hours}ч. `;
            text += `${minutes}м. ${seconds}с.`;
            return text;
        }

        async function fetchGroup() {
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .order('username', { ascending: true });

            if (error) {
                console.error(error);
                return;
            }

            // РЕНДЕР СПИСКА ГРУППЫ
            document.getElementById('groupList').innerHTML = data.map(user => {
                const isOnline = user.status === '🟢 Онлайн';
                const pulseHtml = isOnline ? `<span class="online-pulse" title="Сейчас в учебе"></span>` : '';
                const timerHtml = isOnline && user.study_start_time ? `<div class="timer-badge" data-start="${user.study_start_time}">...</div>` : '';
                
                // Рендер значков пользователя
                const badgesHtml = (user.achievements || []).map(b => BADGES[b] || '').join('');

                return `
                    <div class="user-item">
                        <div class="status-dot" style="background: ${user.color || '#555'}"></div>
                        <div class="username">
                            ${escapeHtml(user.username || 'Без имени')} ${pulseHtml}
                            <span class="achievements-badges">${badgesHtml}</span>
                        </div>
                        ${timerHtml}
                        <div class="status-tag">${user.status || 'Нет статуса'}</div>
                    </div>
                `;
            }).join('');

            // РЕНДЕР ТОП СТУДЕНТОВ (Лидерборд)
            const topUsers = [...data]
                .filter(u => u.total_study_time > 0)
                .sort((a, b) => (b.total_study_time || 0) - (a.total_study_time || 0))
                .slice(0, 3); // Берем только топ-3
            
            const medals = ['🥇', '🥈', '🥉'];
            
            if (topUsers.length > 0) {
                document.getElementById('leaderboardList').innerHTML = topUsers.map((user, index) => {
                    return `
                        <div class="top-user-item">
                            <div><span class="top-medal">${medals[index] || ''}</span> ${escapeHtml(user.username)}</div>
                            <div style="color: var(--primary-blue); font-weight: bold;">${formatTime((user.total_study_time || 0) * 1000, true)}</div>
                        </div>
                    `;
                }).join('');
            } else {
                document.getElementById('leaderboardList').innerHTML = '<div style="text-align: center; color: var(--text-dim); font-size: 0.9rem;">Пока нет данных</div>';
            }

            // Обновление локальных данных текущего пользователя
            if (currentUser) {
                const me = data.find(u => u.id === currentUser.id);
                if (me) {
                    myProfileData = me; // Сохраняем актуальные данные для проверок достижений
                    const isOnline = me.status === '🟢 Онлайн';
                    const btnStart = document.getElementById('btnStart');
                    const btnEnd = document.getElementById('btnEnd');

                    if (btnStart && btnEnd) {
                        btnStart.style.display = isOnline ? 'none' : 'flex';
                        btnEnd.style.display = isOnline ? 'flex' : 'none';
                    }

                    myStartTime = isOnline ? me.study_start_time : null;
                    const mainTimerEl = document.getElementById('mainTimerText');

                    if (!isOnline && mainTimerEl) {
                        mainTimerEl.innerText = me.status === '☕ Перерыв' ? 'На паузе' : '0 сек.';
                    }
                }
            }
        }

        async function loadMessages() {
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(50);

            if (error) {
                console.error(error);
                document.getElementById('chatBox').innerHTML = `<div style="color: var(--danger-red);">Ошибка загрузки чата.</div>`;
                return;
            }

            renderMessages(data);
        }

        function renderMessages(messages) {
            const chatBox = document.getElementById('chatBox');
            if (!messages || messages.length === 0) {
                chatBox.innerHTML = `<div style="color: var(--text-dim);">Пока сообщений нет. Напиши первым.</div>`;
                return;
            }

            chatBox.innerHTML = messages.map(msg => `
                <div class="chat-message">
                    <span class="chat-name">${escapeHtml(msg.username)}:</span>
                    <span class="chat-text">${escapeHtml(msg.text)}</span>
                </div>
            `).join('');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            if (!currentUser) {
                alert('Сначала войдите через Google');
                return;
            }

            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const username = currentUser.user_metadata.full_name || currentUser.email;

            // 1. Отправляем сообщение
            const { error: msgError } = await supabase.from('messages').insert({
                user_id: currentUser.id,
                username: username,
                text: text
            });

            if (msgError) {
                console.error(msgError);
                alert('Ошибка отправки сообщения.');
                return;
            }
            
            input.value = '';

            // 2. Обновляем счетчик сообщений и проверяем достижение "Активист"
            if (myProfileData) {
                let updates = { message_count: (myProfileData.message_count || 0) + 1 };
                let currentAchievs = myProfileData.achievements || [];

                // ДОСТИЖЕНИЕ: Активист (написал 20 сообщений)
                if (updates.message_count >= 20 && !currentAchievs.includes('activist')) {
                    currentAchievs.push('activist');
                    updates.achievements = currentAchievs;
                    alert("Поздравляем! Вы получили значок 'Активист' 💬 за 20 сообщений!");
                }

                await updateMyProfile(updates);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text || '';
            return div.innerHTML;
        }

        document.getElementById('sendMessageBtn').onclick = sendMessage;
        document.getElementById('chatInput').addEventListener('keydown', event => {
            if (event.key === 'Enter') sendMessage();
        });

        // Слушаем изменения в чате
        supabase.channel('public-messages')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => loadMessages())
            .subscribe();

        // Таймеры
        setInterval(() => {
            const now = new Date().getTime();
            document.querySelectorAll('.timer-badge').forEach(el => {
                const startStr = el.getAttribute('data-start');
                if (!startStr) return;
                const diff = now - new Date(startStr).getTime();
                el.innerText = formatTime(diff);
            });

            if (myStartTime && document.getElementById('mainTimerText')) {
                const diff = now - new Date(myStartTime).getTime();
                document.getElementById('mainTimerText').innerText = formatTime(diff);
            }
        }, 1000);

        checkUser();
        // Запрашиваем профили чаще, чтобы быстрее обновлять таймеры и статусы других
        setInterval(fetchGroup, 5000);
    </script>
</body>
</html>
