<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебный портал | Студент</title>
    <style>
        :root {
            --bg-main: #18181b;       /* Очень темный серый, почти черный */
            --bg-panel: #27272a;      /* Цвет панелей */
            --bg-hover: #3f3f46;
            --accent: #10b981;        /* Изумрудный акцент */
            --accent-hover: #059669;
            --text-light: #f4f4f5;
            --text-dim: #a1a1aa;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #3f3f46;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        /* Главный контейнер (Стиль мессенджера) */
        .app-layout {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            height: 90vh;
        }

        /* ЛЕВАЯ ПАНЕЛЬ (Профиль) */
        .sidebar {
            width: 300px;
            background: var(--bg-panel);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .profile-header { text-align: center; margin-bottom: 20px; }
        .profile-name { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        
        .timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
            text-align: center;
            margin: 20px 0;
            font-family: monospace;
        }

        .stats-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .stat-row { display: flex; justify-content: space-between; font-size: 0.9rem; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
        .stat-row span:last-child { font-weight: bold; color: var(--accent); }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px; color: white;
        }
        .btn-start { background: var(--accent); }
        .btn-start:hover { background: var(--accent-hover); }
        .btn-stop { background: var(--danger); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
        .btn-outline:hover { background: var(--bg-hover); color: var(--text-light); }

        /* ПРАВАЯ ПАНЕЛЬ (Контент) */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: var(--bg-panel);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .panel-title { font-size: 1.1rem; margin-bottom: 15px; color: var(--text-dim); border-bottom: 1px solid var(--border); padding-bottom: 10px; }

        /* ТОП СТУДЕНТОВ */
        .top-list { max-height: 200px; overflow-y: auto; }
        .student-row { display: flex; align-items: center; padding: 10px; border-radius: 8px; margin-bottom: 5px; background: var(--bg-main); }
        .student-rank { width: 30px; font-weight: bold; color: var(--text-dim); }
        .student-name { flex: 1; }
        .student-time { font-size: 0.85rem; color: var(--accent); }
        .rank-1 { color: var(--warning); font-size: 1.2rem; }

        /* АЧИВКИ */
        .achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .badge {
            background: var(--bg-main); border: 1px solid var(--border); border-radius: 12px;
            padding: 15px 10px; text-align: center; opacity: 0.4; transition: 0.3s;
        }
        .badge.active { opacity: 1; border-color: var(--accent); background: rgba(16, 185, 129, 0.1); }
        .badge-icon { font-size: 2rem; margin-bottom: 5px; display: block; }
        .badge-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 3px; }
        .badge-desc { font-size: 0.7rem; color: var(--text-dim); }

        /* ЧАТ */
        .chat-container { flex: 1; display: flex; flex-direction: column; min-height: 250px; }
        .chat-messages { flex: 1; background: var(--bg-main); border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; border: 1px solid var(--border); }
        .msg { margin-bottom: 8px; font-size: 0.95rem; }
        .msg b { color: var(--accent); }
        .chat-controls { display: flex; gap: 10px; }
        .chat-input { flex: 1; padding: 12px; background: var(--bg-main); border: 1px solid var(--border); color: white; border-radius: 8px; outline: none; }
        .chat-input:focus { border-color: var(--accent); }
        .btn-send { width: 60px; background: var(--accent); margin: 0; }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .app-layout { flex-direction: column; height: auto; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar">
            <div id="authBlock">
                <div style="text-align: center; color: var(--text-dim);">Проверка авторизации...</div>
            </div>
        </aside>

        <main class="main-content">
            
            <div class="panel" style="flex: unset;">
                <div class="panel-title">🏆 Рейтинг и Достижения</div>
                <div class="achievements-grid" id="badgesGrid">
                    </div>
            </div>

            <div class="app-layout" style="gap: 20px; height: auto;">
                <div class="panel" style="flex: 1;">
                    <div class="panel-title">👥 Топ студентов</div>
                    <div class="top-list" id="studentsTop">
                        <div style="color: var(--text-dim); font-size: 0.9rem;">Загрузка списка...</div>
                    </div>
                </div>

                <div class="panel chat-container" style="flex: 1;">
                    <div class="panel-title">💬 Общий чат</div>
                    <div class="chat-messages" id="chatArea"></div>
                    <div class="chat-controls">
                        <input type="text" id="msgInput" class="chat-input" placeholder="Введите сообщение...">
                        <button class="btn btn-start btn-send" id="sendBtn">➤</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // Твои ключи (оставил твои родные)
        const URL = 'https://ysqixhzrevitbcqmhhuz.supabase.co';
        const KEY = 'sb_publishable_1QFd7P35_JdzaMJLps-n7w_TPWQ0sDI';
        const supabase = createClient(URL, KEY);

        let userSession = null;
        let sessionStartTime = null;
        let userData = null;

        const BADGES = [
            { id: 'first_step', icon: '🚀', title: 'Первый запуск', desc: 'Начал первую сессию' },
            { id: 'early_bird', icon: '🌅', title: 'Ранняя пташка', desc: 'Учеба до 8:00 утра' },
            { id: 'marathon', icon: '⏳', title: 'Марафонец', desc: '2 часа без перерыва' },
            { id: 'activist', icon: '🔥', title: 'Активист', desc: '20+ сообщений в чат' }
        ];

        // Инициализация
        async function init() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                userSession = user;
                await supabase.from('profiles').upsert({
                    id: user.id,
                    username: user.user_metadata.full_name || user.email
                }, { onConflict: 'id' });

                fetchProfile();
                fetchLeaderboard();
            } else {
                document.getElementById('authBlock').innerHTML = `
                    <div class="profile-header">
                        <div class="profile-name">Привет, Студент!</div>
                        <span style="font-size:0.8rem; color:var(--text-dim)">Войди для сохранения прогресса</span>
                    </div>
                    <button class="btn btn-start" onclick="signIn()">Войти через Google</button>
                `;
            }
            loadChat();
        }

        window.signIn = () => supabase.auth.signInWithOAuth({ provider: 'google' });
        window.signOut = async () => { await supabase.auth.signOut(); location.reload(); };

        // Получение данных профиля
        async function fetchProfile() {
            const { data } = await supabase.from('profiles').select('*').eq('id', userSession.id).single();
            userData = data;
            renderSidebar(data);
            renderBadges(data.achievements || []);
        }

        // Отрисовка левой панели
        function renderSidebar(data) {
            const authBlock = document.getElementById('authBlock');
            const studyMinutes = Math.floor((data.total_study_time || 0) / 60);
            const isOnline = data.status === '🟢 Онлайн';
            
            authBlock.innerHTML = `
                <div class="profile-header">
                    <div class="profile-name">${data.username}</div>
                    <span style="font-size:0.8rem; color:var(--text-dim)">${data.status || 'Статус не задан'}</span>
                </div>
                
                <div class="timer-display" id="activeTimer">00:00</div>

                <div class="stats-list">
                    <div class="stat-row"><span>Время учебы:</span> <span>${studyMinutes} мин.</span></div>
                    <div class="stat-row"><span>Всего сессий:</span> <span>${data.session_count || 0}</span></div>
                    <div class="stat-row"><span>Сообщений:</span> <span>${data.message_count || 0}</span></div>
                </div>

                <button class="btn btn-start" style="display:${isOnline ? 'none' : 'block'}" onclick="toggleSession(true)">▶ Начать сессию</button>
                <button class="btn btn-stop" style="display:${isOnline ? 'block' : 'none'}" onclick="toggleSession(false)">⛔ Завершить сессию</button>
                
                <div style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px;">
                    <button class="btn btn-outline" onclick="signOut()">Выйти из аккаунта</button>
                </div>
            `;
            sessionStartTime = isOnline ? data.study_start_time : null;
        }

        // Выдача ачивок
        async function unlockBadge(badgeId) {
            let currentBadges = userData.achievements || [];
            if (!currentBadges.includes(badgeId)) {
                currentBadges.push(badgeId);
                await supabase.from('profiles').update({ achievements: currentBadges }).eq('id', userSession.id);
                fetchProfile(); // Обновляем UI
            }
        }

        // Управление сессией
        window.toggleSession = async (start) => {
            const now = new Date();
            const updates = {};

            if (start) {
                updates.status = '🟢 Онлайн';
                updates.study_start_time = now.toISOString();
                updates.session_count = (userData.session_count || 0) + 1;
                
                unlockBadge('first_step'); // Ачивка за старт
                if (now.getHours() < 8) unlockBadge('early_bird'); // Ачивка до 8 утра

            } else {
                updates.status = '🔴 Офлайн';
                if (userData.study_start_time) {
                    const secondsSpent = Math.floor((now - new Date(userData.study_start_time)) / 1000);
                    updates.total_study_time = (userData.total_study_time || 0) + secondsSpent;
                    updates.study_start_time = null;

                    if (secondsSpent >= 7200) unlockBadge('marathon'); // Ачивка за 2 часа (7200 сек)
                }
            }

            await supabase.from('profiles').update(updates).eq('id', userSession.id);
            fetchProfile();
            fetchLeaderboard();
        };

        // Отрисовка ачивок
        function renderBadges(unlocked) {
            const grid = document.getElementById('badgesGrid');
            grid.innerHTML = BADGES.map(b => `
                <div class="badge ${unlocked.includes(b.id) ? 'active' : ''}">
                    <span class="badge-icon">${b.icon}</span>
                    <div class="badge-title">${b.title}</div>
                    <div class="badge-desc">${b.desc}</div>
                </div>
            `).join('');
        }

        // Рейтинг студентов (Топ)
        async function fetchLeaderboard() {
            const { data } = await supabase.from('profiles').select('*').order('total_study_time', { ascending: false }).limit(10);
            document.getElementById('studentsTop').innerHTML = data.map((student, index) => `
                <div class="student-row">
                    <div class="student-rank ${index === 0 ? 'rank-1' : ''}">${index === 0 ? '👑' : index + 1}</div>
                    <div class="student-name">${student.username}</div>
                    <div class="student-time">${Math.floor((student.total_study_time || 0)/60)} мин</div>
                </div>
            `).join('');
        }

        // Чат
        async function loadChat() {
            const { data } = await supabase.from('messages').select('*').order('created_at', { ascending: true }).limit(50);
            const chat = document.getElementById('chatArea');
            chat.innerHTML = (data || []).map(m => `<div class="msg"><b>${m.username}:</b> ${m.text}</div>`).join('');
            chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById('sendBtn').onclick = async () => {
            const input = document.getElementById('msgInput');
            if (!input.value.trim() || !userSession) return;
            
            const newMsgCount = (userData.message_count || 0) + 1;

            // Отправляем сообщение
            await supabase.from('messages').insert({ 
                user_id: userSession.id, 
                username: userSession.user_metadata.full_name || userSession.email, 
                text: input.value 
            });

            // Обновляем статистику сообщений
            await supabase.from('profiles').update({ message_count: newMsgCount }).eq('id', userSession.id);
            
            if (newMsgCount >= 20) unlockBadge('activist'); // Ачивка за 20 сообщений

            input.value = '';
            fetchProfile();
        };

        // Отправка по Enter
        document.getElementById('msgInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') document.getElementById('sendBtn').click();
        });

        // Работа таймера в реальном времени
        setInterval(() => {
            if (sessionStartTime) {
                const diff = Math.floor((new Date().getTime() - new Date(sessionStartTime).getTime()) / 1000);
                const m = String(Math.floor(diff / 60)).padStart(2, '0');
                const s = String(diff % 60).padStart(2, '0');
                document.getElementById('activeTimer').innerText = `${m}:${s}`;
            } else {
                document.getElementById('activeTimer').innerText = `00:00`;
            }
        }, 1000);

        // Подписка на обновления чата
        supabase.channel('public:messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, loadChat).subscribe();
        
        init();
        setInterval(fetchLeaderboard, 15000); // Обновляем топ каждые 15 сек
    </script>
</body>
</html>
