<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монитор статусов + Чат Pro</title>
    <style>
        :root { 
            --bg-color: #0d0d12; 
            --card-bg: #16161e; 
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #23232e;
            --primary-blue: #00f5ff;
            --danger-red: #ff4d4d;
            --success-green: #00ff88;
            --warning-yellow: #ffb703;
            --accent-purple: #7000ff;
        }

        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: var(--bg-color); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            color: var(--text-main); 
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 24px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 550px; 
            margin-bottom: 20px; 
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        /* ТАЙМЕР */
        .widget-timer {
            text-align: center;
            font-size: 3rem;
            color: var(--primary-blue);
            font-weight: 800;
            margin: 15px 0;
            text-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
        }

        /* СЕТКА СТАТИСТИКИ */
        .stats-grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 10px; text-align: center; margin: 20px 0;
        }
        .stat-item { background: #1c1c27; padding: 12px 5px; border-radius: 12px; border: 1px solid var(--border-color); }
        .stat-val { display: block; font-weight: bold; font-size: 1.1rem; color: var(--primary-blue); }
        .stat-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }

        /* КНОПКИ СТАТУСА (Сетка 2х2) */
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-status {
            background: #1c1c27; border: 1px solid var(--border-color);
            color: white; padding: 12px; border-radius: 12px;
            cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; transition: 0.2s;
        }
        .btn-status:hover { background: #252535; }

        /* ВКЛАДКИ */
        .tabs { display: flex; background: #1c1c27; border-radius: 12px; padding: 5px; margin: 15px 0; }
        .tab { flex: 1; padding: 10px; border: none; background: none; color: var(--text-muted); cursor: pointer; border-radius: 8px; font-weight: 600; }
        .tab.active { background: #252535; color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ДОСТИЖЕНИЯ */
        .ach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .ach-card { 
            background: #1c1c27; padding: 15px; border-radius: 15px; 
            border: 1px solid var(--border-color); opacity: 0.4; filter: grayscale(1); transition: 0.3s;
        }
        .ach-card.unlocked { opacity: 1; filter: none; border-color: var(--accent-purple); }
        .ach-title { font-size: 0.85rem; font-weight: bold; display: block; margin-top: 5px; }
        .ach-desc { font-size: 0.7rem; color: var(--text-muted); }

        /* ОСТАЛЬНЫЕ КНОПКИ */
        .btn-full { width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; margin-bottom: 10px; color: white; font-size: 1rem; }
        .btn-green { background: var(--success-green); color: #000; }
        .btn-red { background: var(--danger-red); }
        .btn-grey { background: #2a2a3a; color: var(--text-muted); }

        .user-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 12px; }
        .username { font-weight: 600; flex-grow: 1; }
        .timer-badge { font-size: 0.8rem; background: #1c1c27; padding: 4px 8px; border-radius: 6px; margin-right: 10px; color: var(--primary-blue); }

        /* ЧАТ */
        .chat-box { height: 200px; background: #0a0a0f; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; overflow-y: auto; margin-bottom: 12px; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background: #1c1c27; color: white; outline: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>ВАШ ПРОФИЛЬ</h2>
        <div id="authSection">
            <div style="text-align: center; color: var(--text-muted);">Загрузка профиля...</div>
        </div>
    </div>

    <div class="card">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('tab-group', this)">👥 Группа</button>
            <button class="tab" onclick="switchTab('tab-achievements', this)">🏅 Достижения</button>
        </div>

        <div id="tab-group" class="tab-content active">
            <div id="groupList">
                <div style="text-align: center; color: var(--text-muted);">Загрузка...</div>
            </div>
        </div>

        <div id="tab-achievements" class="tab-content">
            <div class="ach-grid" id="achGrid">
                </div>
        </div>
    </div>

    <div class="card">
        <h2>ОБЩИЙ ЧАТ</h2>
        <div id="chatBox" class="chat-box"></div>
        <div class="chat-input-row">
            <input id="chatInput" class="chat-input" placeholder="Написать сообщение..." />
            <button id="sendMessageBtn" class="btn-green" style="width: 50px; border-radius: 10px; cursor: pointer;">➤</button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const URL = 'https://ysqixhzrevitbcqmhhuz.supabase.co';
        const KEY = 'sb_publishable_1QFd7P35_JdzaMJLps-n7w_TPWQ0sDI';
        const supabase = createClient(URL, KEY);

        let currentUser = null;
        let myStartTime = null;
        let myData = null;

        const ACHIEVEMENTS_LIST = [
            { id: 'first_step', icon: '🌱', title: 'Первый шаг', desc: 'Провел первую сессию' },
            { id: 'marathon', icon: '🏃', title: 'Марафонец', desc: 'Учился более 1 часа' },
            { id: 'activist', icon: '📢', title: 'Активист', desc: 'Написал 20 сообщений' },
            { id: 'legend', icon: '⚡', title: 'Легенда', desc: 'Накопил 10 часов учебы' }
        ];

        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                currentUser = user;
                // Инициализируем профиль с новыми колонками (если их нет)
                await supabase.from('profiles').upsert({
                    id: user.id,
                    username: user.user_metadata.full_name || user.email
                }, { onConflict: 'id' });

                fetchMyData();
                fetchGroup();
            } else {
                document.getElementById('authSection').innerHTML = `<button class="btn-full btn-green" onclick="login()">Войти через Google</button>`;
            }
            loadMessages();
        }

        window.login = () => supabase.auth.signInWithOAuth({ provider: 'google' });

        async function fetchMyData() {
            const { data } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            myData = data;
            renderProfileWidget(data);
            renderAchievements(data.achievements || []);
        }

        function renderProfileWidget(data) {
            const authSection = document.getElementById('authSection');
            authSection.innerHTML = `
                <div style="font-weight:bold; font-size:1.2rem; margin-bottom:10px;">${data.username}</div>
                
                <div class="widget-timer" id="mainTimerText">0 сек.</div>

                <div class="stats-grid">
                    <div class="stat-item"><span class="stat-val">${Math.floor((data.total_study_time || 0)/60)}м</span><span class="stat-label">Учеба</span></div>
                    <div class="stat-item"><span class="stat-val">${data.session_count || 0}</span><span class="stat-label">Сессии</span></div>
                    <div class="stat-item"><span class="stat-val">${data.message_count || 0}</span><span class="stat-label">Сообщ</span></div>
                    <div class="stat-item"><span class="stat-val">${(data.achievements || []).length}</span><span class="stat-label">Достиж</span></div>
                </div>

                <button class="btn-full btn-green" id="btnStart" style="display:${data.status === '🟢 Онлайн' ? 'none' : 'block'}" onclick="updateStatus('🟢 Онлайн', '#00ff88', true)">▶ Начать сессию</button>
                <button class="btn-full btn-red" id="btnEnd" style="display:${data.status === '🟢 Онлайн' ? 'block' : 'none'}" onclick="updateStatus('🔴 Офлайн', '#ff4d4d', false)">⛔ Завершить</button>

                <div class="status-grid">
                    <button class="btn-status" onclick="updateStatus('🟡 Отошел', '#ffb703', false)">🟡 Отошел</button>
                    <button class="btn-status" onclick="updateStatus('🔴 Занят', '#ff4d4d', false)">🔴 Занят</button>
                    <button class="btn-status" onclick="updateStatus('⚪ Тишина', '#8e8e93', false)">⚪ Тишина</button>
                    <button class="btn-status" onclick="logout()">🚪 Выход</button>
                </div>
            `;
            myStartTime = data.status === '🟢 Онлайн' ? data.study_start_time : null;
        }

        window.updateStatus = async (text, color, isStart) => {
            const updates = { status: text, color: color };
            const now = new Date();

            if (isStart) {
                updates.study_start_time = now.toISOString();
                updates.session_count = (myData.session_count || 0) + 1;
                
                // Добавляем достижение "Первый шаг"
                let achs = myData.achievements || [];
                if (!achs.includes('first_step')) achs.push('first_step');
                updates.achievements = achs;
            } else if (myData.study_start_time) {
                const diff = Math.floor((now - new Date(myData.study_start_time)) / 1000);
                updates.total_study_time = (myData.total_study_time || 0) + diff;
                updates.study_start_time = null;
            }

            await supabase.from('profiles').update(updates).eq('id', currentUser.id);
            fetchMyData();
            fetchGroup();
        };

        function renderAchievements(myAchs) {
            const grid = document.getElementById('achGrid');
            grid.innerHTML = ACHIEVEMENTS_LIST.map(ach => `
                <div class="ach-card ${myAchs.includes(ach.id) ? 'unlocked' : ''}">
                    <span style="font-size:1.5rem">${ach.icon}</span>
                    <span class="ach-title">${ach.title}</span>
                    <span class="ach-desc">${ach.desc}</span>
                </div>
            `).join('');
        }

        window.switchTab = (id, btn) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        };

        window.logout = async () => { await supabase.auth.signOut(); location.reload(); };

        // Твои функции ЧАТА и МОНИТОРА (без изменений логики)
        async function fetchGroup() {
            const { data } = await supabase.from('profiles').select('*').order('total_study_time', { ascending: false });
            document.getElementById('groupList').innerHTML = data.map((user, i) => `
                <div class="user-item">
                    <div style="font-size:0.8rem; width:20px; color:var(--text-muted)">${i+1}</div>
                    <div class="status-dot" style="background: ${user.color || '#555'}"></div>
                    <div class="username">${user.username}</div>
                    ${user.status === '🟢 Онлайн' && user.study_start_time ? `<div class="timer-badge" data-start="${user.study_start_time}">...</div>` : ''}
                    <div style="font-size:0.75rem; color:var(--text-muted)">${Math.floor((user.total_study_time || 0)/60)}м</div>
                </div>
            `).join('');
        }

        async function loadMessages() {
            const { data } = await supabase.from('messages').select('*').order('created_at', { ascending: true }).limit(50);
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = (data || []).map(msg => `<div><b>${msg.username}:</b> ${msg.text}</div>`).join('');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('sendMessageBtn').onclick = async () => {
            const input = document.getElementById('chatInput');
            if (!input.value.trim() || !currentUser) return;
            
            await supabase.from('messages').insert({ 
                user_id: currentUser.id, 
                username: currentUser.user_metadata.full_name || currentUser.email, 
                text: input.value 
            });

            // Обновляем счетчик сообщений в профиле
            await supabase.from('profiles').update({ message_count: (myData.message_count || 0) + 1 }).eq('id', currentUser.id);
            
            input.value = '';
            fetchMyData();
        };

        // Твой таймер и Realtime
        setInterval(() => {
            const now = new Date().getTime();
            document.querySelectorAll('.timer-badge').forEach(el => {
                const diff = now - new Date(el.getAttribute('data-start')).getTime();
                el.innerText = Math.floor(diff/1000) + 'с.';
            });
            if (myStartTime) {
                const diff = now - new Date(myStartTime).getTime();
                document.getElementById('mainTimerText').innerText = Math.floor(diff/1000) + ' сек.';
            }
        }, 1000);

        supabase.channel('messages').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, loadMessages).subscribe();
        checkUser();
        setInterval(fetchGroup, 10000);
    </script>
</body>
</html>
