<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монитор статусов + Достижения</title>
    <style>
        :root { 
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --primary-blue: #3b82f6;
            --danger-red: #e63946;
            --success-green: #2a9d8f;
            --warning-yellow: #ffb703;
            --secondary-grey: #6c757d;
            --gold: #ffd700;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); width: 100%; max-width: 550px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        h2 { margin-top: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        /* Достижения */
        .badge-container { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .badge { background: #333; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; border: 1px solid #444; display: flex; align-items: center; gap: 4px; }
        .badge.earned { border-color: var(--warning-yellow); background: rgba(255, 183, 3, 0.1); }

        /* Таблица лидеров */
        .leaderboard-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
        .rank { font-weight: bold; width: 30px; color: var(--gold); }
        
        /* Стили из вашего кода */
        .widget-timer { text-align: center; font-size: 2.2rem; color: var(--primary-blue); font-weight: bold; margin-bottom: 20px; }
        .btn-full { width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; margin-bottom: 12px; color: white; }
        .btn-green { background: var(--success-green); }
        .btn-red { background: var(--danger-red); }
        .user-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .username { flex-grow: 1; font-weight: 600; }
        .chat-box { height: 150px; background: #181818; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; overflow-y: auto; margin-bottom: 12px; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background: #121212; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h2>👤 Мой профиль</h2>
        <div id="authSection">Загрузка...</div>
        <div id="myBadges" class="badge-container"></div>
    </div>

    <div class="card">
        <h2>🏆 ТОП по времени учебы</h2>
        <div id="leaderboard">Загрузка рейтинга...</div>
    </div>

    <div class="card">
        <h2>👥 Группа</h2>
        <div id="groupList"></div>
    </div>

    <div class="card">
        <h2>💬 Чат</h2>
        <div id="chatBox" class="chat-box"></div>
        <div class="chat-input-row">
            <input id="chatInput" class="chat-input" placeholder="Сообщение..." />
            <button id="sendMessageBtn" style="background:var(--success-green); border:none; border-radius:10px; width:50px; color:white; cursor:pointer;">➤</button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const URL = 'https://ysqixhzrevitbcqmhhuz.supabase.co';
        const KEY = 'sb_publishable_1QFd7P35_JdzaMJLps-n7w_TPWQ0sDI';
        const supabase = createClient(URL, KEY);

        let currentUser = null;
        let myData = null;

        const ACHIEVEMENTS = {
            EARLY_BIRD: { id: 'early', icon: '🌅', label: 'Ранняя пташка', desc: 'Зашел до 8:00' },
            MARATHON: { id: 'marathon', icon: '🏃', label: 'Марафонец', desc: 'Учился > 2 часов' },
            ACTIVIST: { id: 'activist', icon: '📢', label: 'Активист', desc: '20+ сообщений' }
        };

        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                currentUser = user;
                // Получаем расширенные данные профиля
                const { data } = await supabase.from('profiles').select('*').eq('id', user.id).single();
                myData = data;
                
                renderProfileWidget(user);
                checkAchievements();
                fetchGroupAndLeaderboard();
            } else {
                document.getElementById('authSection').innerHTML = `<button onclick="login()">Войти через Google</button>`;
            }
            loadMessages();
        }

        window.login = () => supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });

        function renderProfileWidget(user) {
            document.getElementById('authSection').innerHTML = `
                <div style="font-weight:bold; margin-bottom:10px;">${user.user_metadata.full_name}</div>
                <div class="widget-timer" id="mainTimerText">0 сек.</div>
                <button class="btn-full btn-green" id="btnStart" onclick="updateStatus('🟢 Онлайн', true)">Начать сессию</button>
                <button class="btn-full btn-red" id="btnEnd" style="display:none;" onclick="updateStatus('🔴 Офлайн', false)">Завершить</button>
            `;
            renderBadges();
        }

        function renderBadges() {
            const container = document.getElementById('myBadges');
            const earned = myData?.achievements || [];
            container.innerHTML = Object.values(ACHIEVEMENTS).map(ach => `
                <div class="badge ${earned.includes(ach.id) ? 'earned' : ''}" title="${ach.desc}">
                    ${ach.icon} ${ach.label}
                </div>
            `).join('');
        }

        async function updateStatus(status, isStart) {
            const now = new Date();
            let updates = { id: currentUser.id, status, study_start_time: isStart ? now.toISOString() : null };

            // Логика сохранения времени при завершении
            if (!isStart && myData?.study_start_time) {
                const sessionSeconds = Math.floor((now - new Date(myData.study_start_time)) / 1000);
                updates.total_study_time = (myData.total_study_time || 0) + sessionSeconds;
                
                // Проверка на Марафонца (2 часа = 7200 сек)
                if (sessionSeconds > 7200) await grantAchievement('marathon');
            }

            // Проверка на Раннюю пташку (до 8 утра)
            if (isStart && now.getHours() < 8) await grantAchievement('early');

            await supabase.from('profiles').upsert(updates);
            location.reload(); 
        }

        async function grantAchievement(code) {
            let current = myData?.achievements || [];
            if (!current.includes(code)) {
                current.push(code);
                await supabase.from('profiles').update({ achievements: current }).eq('id', currentUser.id);
            }
        }

        async function fetchGroupAndLeaderboard() {
            const { data } = await supabase.from('profiles').select('*').order('total_study_time', { ascending: false });
            
            // Рендер ТОПа
            document.getElementById('leaderboard').innerHTML = data.slice(0, 5).map((user, index) => `
                <div class="leaderboard-item">
                    <span><span class="rank">#${index + 1}</span> ${user.username}</span>
                    <span style="color:var(--text-muted)">${Math.floor((user.total_study_time || 0)/60)} мин.</span>
                </div>
            `).join('');

            // Рендер группы
            document.getElementById('groupList').innerHTML = data.map(user => `
                <div class="user-item">
                    <div class="username">${user.username}</div>
                    <div class="status-tag">${user.status || 'Офлайн'}</div>
                </div>
            `).join('');
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            const newCount = (myData?.message_count || 0) + 1;
            await supabase.from('messages').insert({ user_id: currentUser.id, username: myData.username, text });
            await supabase.from('profiles').update({ message_count: newCount }).eq('id', currentUser.id);

            if (newCount >= 20) grantAchievement('activist');
            input.value = '';
        }

        // --- Базовые функции чата и таймера (из вашего кода) ---
        async function loadMessages() {
            const { data } = await supabase.from('messages').select('*').order('created_at', { ascending: true }).limit(20);
            document.getElementById('chatBox').innerHTML = data.map(m => `<div><b>${m.username}:</b> ${m.text}</div>`).join('');
            document.getElementById('chatBox').scrollTop = 9999;
        }

        document.getElementById('sendMessageBtn').onclick = sendMessage;
        checkUser();
        setInterval(loadMessages, 5000);
    </script>
</body>
</html>
